[build]
  command = "yarn build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Les règles sont évaluées dans l'ordre. Les fichiers réellement présents
# (images, assets) sont servis avant toute règle.

# 1. L'API doit passer avant tout le reste.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. Les routes connues de l'application sont servies par index.html en 200.
#    ⚠️ Toute nouvelle route ajoutée dans src/App.jsx doit être ajoutée ici,
#    sinon elle renverra une 404.
[[redirects]]
  from = "/creation-site-vitrine"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/creation-site-ecommerce"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/creation-application"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tarifs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/a-propos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# 3. Tout le reste : l'application affiche sa page 404 ET le serveur renvoie
#    un vrai code 404. Sans cette dernière ligne, une URL inexistante
#    répondrait 200 — ce que Google traite comme un « soft 404 ».
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Les fichiers générés par Vite portent un hash : cache maximal.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
