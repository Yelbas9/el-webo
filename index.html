<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>El Webo – Création de sites web modernes et sur-mesure</title>
    <meta
      name="description"
      content="Développeur web freelance spécialisé React & UX/UI. Création de sites vitrines, e-commerce et applications sur-mesure à Paris et partout en France."
    />
    <meta name="author" content="El Webo" />
    <meta
      name="keywords"
      content="développeur web, freelance, React, UX, UI, site vitrine, site web, création site internet, Paris, El Webo"
    />
    <meta name="robots" content="index,follow" />

    <!-- OpenGraph pour Facebook/LinkedIn/Slack, etc. -->
    <meta
      property="og:title"
      content="El Webo – Création de sites web modernes et sur-mesure"
    />
    <meta
      property="og:description"
      content="Développeur web freelance spécialisé React & UX/UI. Création de sites vitrines, e-commerce et applications sur-mesure à Paris et partout en France."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://el-webo.netlify.app/" />
    <meta property="og:site_name" content="El Webo" />
    <!-- Image de partage (remplace par l’URL de ton image SEO adaptée) -->
    <meta property="og:image" content="https://el-webo.netlify.app/ew.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="El Webo – Création de sites web modernes et sur-mesure"
    />
    <meta
      name="twitter:description"
      content="Développeur web freelance spécialisé React & UX/UI. Création de sites vitrines, e-commerce et applications sur-mesure à Paris et partout en France."
    />
    <meta name="twitter:image" content="https://el-webo.netlify.app/ew.webp" />

    <!-- Google Fonts : Epilogue -->
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon WebP -->
    <link rel="icon" type="image/webp" href="/ew.webp" />
    <!-- Si tu veux, ajoute aussi PNG pour compatibilité totale -->
    <!-- <link rel="icon" type="image/png" href="/favicon.png" /> -->

    <!-- Manifest PWA (optionnel, si tu veux rendre installable) -->
    <!-- <link rel="manifest" href="/manifest.webmanifest"> -->

    <!-- Couleur thème navigateur mobile -->
    <meta name="theme-color" content="#F7F5F2" />

    <!-- Canonical URL (SEO anti-duplicate) -->
    <link rel="canonical" href="https://el-webo.netlify.app/" />
  </head>
  <body class="bg-[var(--white)] font-epilogue antialiased">
    <div id="root"></div>

    <!-- Formulaires fantômes pour détection Netlify -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
    </form>
    <form name="contact-modal" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="tel" name="tel" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
