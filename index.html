<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <title data-static-seo>

    <meta data-static-seo property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="El Webo" />
    <meta data-static-seo property="og:title"
      content="El Webo – Création de sites web & applications sur mesure"

      content="Sites vitrines, e-commerce et applications en React. Design unique, performances au top, devis gratuit sous 24h."

    <meta data-static-seo property="og:image" content="https://el-webo.netlify.app/og.jpg" />
    <meta data-static-seo property="og:image:width" content="1200" />
    <meta data-static-seo property="og:image:height" content="630" />
    <meta data-static-seo property="og:image:alt"
      content="El Webo – création de sites web et d'applications"
    />
    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <meta data-static-seo name="twitter:site" content="@EL_WEBO_DEV" />
    <meta data-static-seo name="twitter:title"
      content="El Webo – Création de sites web & applications sur mesure"
    />
    <meta data-static-seo name="twitter:description"
      content="Sites vitrines, e-commerce et applications en React. Design unique, performances au top, devis gratuit sous 24h."
    />
    <meta data-static-seo name="twitter:image" content="https://el-webo.netlify.app/og.jpg" />

    <!-- Google Fonts : Epilogue (variable, italiques incluses) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Données structurées : entreprise + prestations -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://el-webo.netlify.app/#business",
        "name": "El Webo",
        "description": "Création de sites web vitrines, de boutiques en ligne et d'applications sur mesure en React, depuis la Gironde et partout en France.",
        "url": "https://el-webo.netlify.app/",
        "image": "https://el-webo.netlify.app/og.jpg",
        "logo": "https://el-webo.netlify.app/logo.png",
        "email": "elwebo.dev@gmail.com",
        "priceRange": "€€",
        "founder": { "@type": "Person", "name": "Ibrahim Yelbas" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "5 impasse des Pruniers",
          "addressLocality": "Saint-Sulpice-et-Cameyrac",
          "postalCode": "33450",
          "addressRegion": "Gironde",
          "addressCountry": "FR"
        },
        "areaServed": [
          { "@type": "Country", "name": "France" },
          { "@type": "AdministrativeArea", "name": "Gironde" },
          { "@type": "City", "name": "Bordeaux" }
        ],
        "availableLanguage": ["fr"],
        "sameAs": [
          "https://www.instagram.com/el.webo.dev/",
          "https://www.tiktok.com/@el.webo.dev",
          "https://github.com/Yelbas9",
          "https://x.com/EL_WEBO_DEV"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Prestations El Webo",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Site vitrine",
                "description": "Site vitrine sur mesure pour présenter son activité et générer des contacts."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Site e-commerce",
                "description": "Boutique en ligne sur mesure : catalogue, panier et paiement sécurisé."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Application mobile",
                "description": "Application mobile iOS et Android développée en React Native."
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="font-epilogue antialiased">
    <div id="root"></div>

    <!--
      Formulaires statiques détectés par Netlify au build.
      Les formulaires React postent ensuite sur ces noms. Ne pas supprimer.
    -->
    <form name="contact-modal" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="tel" name="tel" />
      <input type="text" name="projet" />
      <input type="text" name="budget" />
      <input type="text" name="echeance" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="contact-rappel" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <noscript>
      <div style="padding: 24px; font-family: sans-serif">
        <h1>El Webo – Création de sites web et d'applications</h1>
        <p>
          Ce site a besoin de JavaScript pour s'afficher. Vous pouvez me
          contacter directement à
          <a href="mailto:elwebo.dev@gmail.com">elwebo.dev@gmail.com</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
